[project]
name = "lmrecon"
version = "0.1.0"
requires-python = ">= 3.12"
authors = [{ name = "Dominik Stiller", email = "dstiller@uw.edu" }]
license = "MIT"
license-files = ["LICENSE"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.tasks]
dask-cluster = { cmd = [
    "python",
    "lmrecon/scripts/start_local_dask_cluster.py",
] }

[tool.pixi.dependencies]
pip = "*"
python = "3.12.*"
esgf-pyclient = "*"
ecgtools = "*"
python-graphviz = "*"
numpy = ">=2.2,<2.4"
xarray = "*"
pandas = "*"
bottleneck = "*"
cmocean = "*"
cf-xarray = "*"
h5netcdf = "*"
flox = "*"
matplotlib = "*"
seaborn = "*"
cartopy = "*"
nc-time-axis = "*"
xesmf = ">=0.9"
xgcm = "*"
pyshtools = "*"
jupyter = "*"
ruff = "*"
intake-esm = "*"
dask = "*"
regionmask = "*"
scikit-learn = "*"
tqdm = "*"
numexpr = "*"
ipython = "*"
# Restarting hangs with higher versions (https://github.com/microsoft/vscode-jupyter/issues/17151)
ipykernel = "<=6.30"
loky = "*"
arviz = "*"
pre-commit = "*"
ncar-jobqueue = "*"
virtualizarr = ">=2.0"
kerchunk = "*"
fastparquet = "*"
pint-xarray = "*"
zarr = ">=3.0"
hvplot = "*"
geoviews = "*"
fair = "*"
climlab = "*"
openpyxl = "*"
metpy = "*"
palettable = "*"
statsmodels = "*"
xskillscore = "*"
xeofs = "*"
intake-esgf = "*"
cmcrameri = "*"
# Issues with installing GDAL for rasterior >= 1.4.4 -> remove pin when fixed
rasterio = "<1.4.4"

[tool.pixi.pypi-dependencies]
lmrecon = { path = ".", editable = true }
pylipd = { git = "git+https://github.com/LinkedEarth/pylipd.git", rev = "main" }
pyspharm = { git = "git+https://github.com/jswhit/pyspharm", rev = "master" }
pyleoclim = { git = "git+https://github.com/LinkedEarth/Pyleoclim_util.git", rev = "master" }
mpsplines = { git = "git+https://github.com/jararias/mpsplines.git", rev = "master" }
# cfr changed API afterwards, which breaks pickled objects
cfr = "<=2026.1.31"
xrscipy = "*"
pens = "*"

[tool.pixi.target.linux-64.dependencies]
gridfill = "*"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb", "cesmcases"]

[tool.ruff.lint]
# Inspired by xarray (https://github.com/pydata/xarray/blob/main/pyproject.toml)
extend-select = [
    "F",   # Pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "FA",  # flake8-future-annotations
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "TC",  # flake8-type-checking
    "SIM", # flake8-simplify
    "RUF", # Ruff
]
ignore = [
    "E741",   # Ambiguous variable name
    "E501",   # Line too long,
    "C408",   # Unnecessary collection call, but xarray prefers dict() for .sel
    "RUF001", # Ambiguous unicode char
    "RUF100", # Unused noqa
    "RUF059", # Unused unpacked variable
    "SIM108", # Use ternary if-else
    "SIM300", # Yoda condition (const == var instead of var == const)
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
